<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="evan café racer — 05.30.2026. scabs group.">
  <title>scabs</title>
  <meta name="author" content="@sandithxyz">
  <link rel="canonical" href="https://scabs.online">
  <meta name="theme-color" content="#F5F5F5">
  <meta property="og:type" content="website">
  <meta property="og:title" content="scabs">
  <meta property="og:description" content="evan café racer — 05.30.2026. scabs group.">
  <meta property="og:url" content="https://scabs.online">
  <meta property="og:image" content="https://scabs.online/assets/landing/landing.webp">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="scabs">
  <meta name="twitter:description" content="evan café racer — 05.30.2026. scabs group.">
  <meta name="twitter:image" content="https://scabs.online/assets/landing/landing.webp">
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap">
  <link rel="stylesheet" href="style.css">
  <style>
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .landing-page {
      display: block;
      flex: none;
      position: relative;
      overflow: hidden;
      margin-left: calc(-1 * var(--frame-pad));
      margin-right: calc(-1 * var(--frame-pad));
    }

    .landing-page__img {
      width: 100%;
      height: auto;
      display: block;
      margin-bottom: -40px;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    .landing-page__btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: var(--paper);
      color: var(--onyx);
      font-family: var(--font);
      font-size: var(--text-12);
      font-weight: 400;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: var(--space-3) var(--space-8);
      white-space: nowrap;
      z-index: 10;
      transition: background-color var(--transition);
    }

    .landing-page__btn:hover {
      background-color: var(--dust);
    }

    .landing-collage {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      flex-shrink: 0;
      margin-left: calc(-1 * var(--frame-pad));
      margin-right: calc(-1 * var(--frame-pad));
      margin-bottom: calc(-1 * var(--frame-pad));
    }

    .landing-collage__item {
      display: block;
      overflow: hidden;
      aspect-ratio: 3 / 4;
    }

    .landing-collage__img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      transition: opacity 500ms ease;
    }

    .landing-collage__item:hover .landing-collage__img {
      opacity: 0.75;
    }

    .landing-shop-btn {
      display: none;
    }

    @media (max-width: 768px) {
      main {
        position: relative;
      }
      .landing-page {
        display: none;
      }
      .landing-collage {
        grid-template-columns: 1fr;
        margin-top: 30px;
        flex: 1;
      }
      .landing-collage__item {
        aspect-ratio: unset;
        height: 100%;
        pointer-events: none;
      }
      .landing-collage__item:nth-child(2),
      .landing-collage__item:nth-child(3) {
        display: none;
      }
      .landing-shop-btn {
        display: block;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background-color: var(--paper);
        color: var(--onyx);
        font-family: var(--font);
        font-size: var(--text-12);
        font-weight: 400;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        padding: var(--space-3) var(--space-8);
        white-space: nowrap;
        z-index: 10;
      }
      .site-footer {
        margin-top: 0;
      }
    }
  </style>
</head>
<body>

  <!-- ===================== FRAME ===================== -->
  <div class="frame">

    <!-- HEADER -->
    <header class="site-header">
      <a href="index.html" class="site-header__logo-link" aria-label="scabs — home">
        <img
          src="assets/logo.webp"
          alt="SCABS GROUP"
          class="site-header__logo"
          decoding="async"
          loading="eager"
        >
      </a>
    </header>

    <!-- LANDING -->
    <main id="main-content" class="ecom-main">
      <div class="landing-page">
        <img
          src="assets/landing/landing.webp"
          alt="evan café racer"
          class="landing-page__img"
          loading="eager"
          decoding="async"
        >
        <a href="shop.html" class="landing-page__btn">shop now</a>
      </div>
      <div class="landing-collage">
        <a href="shop.html" class="landing-collage__item">
          <img
            src="assets/landing/1.webp"
            alt="evan café racer"
            class="landing-collage__img"
            loading="lazy"
            decoding="async"
          >
        </a>
        <a href="shop.html" class="landing-collage__item">
          <img
            src="assets/landing/2.webp"
            alt="evan café racer"
            class="landing-collage__img"
            loading="lazy"
            decoding="async"
          >
        </a>
        <a href="shop.html" class="landing-collage__item">
          <img
            src="assets/landing/3.webp"
            alt="evan café racer"
            class="landing-collage__img"
            loading="lazy"
            decoding="async"
          >
        </a>
      </div>
      <a href="shop.html" class="landing-shop-btn" aria-label="shop now">shop now</a>
    </main>

  </div><!-- /.frame -->

  <!-- ===================== FOOTER ===================== -->
  <footer class="site-footer">
    <div class="site-footer__inner">
      <a
        href="https://www.instagram.com/scabsonline"
        class="footer-instagram"
        aria-label="scabs group on instagram"
        target="_blank"
        rel="noopener noreferrer"
      >
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
          <circle cx="12" cy="12" r="4"/>
          <circle cx="17.5" cy="6.5" r="0.5" fill="currentColor" stroke="none"/>
        </svg>
      </a>
      <p class="footer-copy">© 2026 scabs group<span class="footer-copy__rights">. all rights reserved.</span></p>
    </div>
  </footer>

  <script src="scripts/main.js"></script>
</body>
</html>
